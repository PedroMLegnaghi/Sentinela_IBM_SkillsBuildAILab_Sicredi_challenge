name: Qualidade

on:
  pull_request:
    branches: [develop, main, refatoracao]
  push:
    branches: [develop, refatoracao]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Black
        run: black --check .
      - name: Ruff
        run: ruff check .
      - name: Testes
        run: pytest -q -rs

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
