name: Qualidade

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Black
        run: black --check .
      - name: Ruff
        run: ruff check .
      - name: Testes
        run: pytest -q -rs
